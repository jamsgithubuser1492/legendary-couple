<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#bfe6f2" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏝️</text></svg>" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Little World" />
    <title>Our Little World</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root">
      <div id="boot" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#bfe6f2;color:#6b4f4f;font-family:system-ui,sans-serif;text-align:center;padding:24px">
        <div style="font-size:56px">🏝️</div>
        <div style="font-size:20px;font-weight:700">Loading Our Little World…</div>
        <div id="boot-error" style="max-width:420px;font-size:13px;color:#a03030"></div>
      </div>
    </div>
    <noscript>Our Little World needs JavaScript turned on.</noscript>
    <script>
      // If something goes wrong, say so on screen instead of leaving a blank page.
      window.addEventListener('error', function (e) {
        var el = document.getElementById('boot-error');
        if (el) el.textContent = 'Something went wrong: ' + (e.message || 'unknown error') + '. Try a hard refresh (Shift + reload).';
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
